name: Daily GitHub Contribution

on:
  schedule:
    # 02:07 UTC = 09:07 WIB (menghindari antrean peak jam genap GitHub Actions)
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      test_failure:
        description: 'Simulate failure to test Telegram alert'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Today TIL note
        run: python3 generate_til.py

      - name: Simulate failure for testing
        if: ${{ inputs.test_failure }}
        run: |
          echo "Simulating failure for Telegram alert test..."
          exit 1

      - name: Commit and Push
        run: |
          git config user.name "Ikhsan Abdul Rafi"
          git config user.email "clashroyae1000@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit today"
          else
            git commit -m "docs: daily til $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Notify failure to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            MSG="⚠️ [daily-til] GitHub Actions workflow gagal dijalankan! Periksa log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}"
          fi
